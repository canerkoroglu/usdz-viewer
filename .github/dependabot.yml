version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
